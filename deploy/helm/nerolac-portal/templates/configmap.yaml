apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nerolac-portal.fullname" . }}-frontend-env
  labels:
    {{- include "nerolac-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: {{ .Values.frontend.env.NODE_ENV | quote }}
  PORT: {{ .Values.frontend.env.PORT | quote }}
  BACKEND_URL: {{ .Values.frontend.env.BACKEND_URL | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nerolac-portal.fullname" . }}-backend-env
  labels:
    {{- include "nerolac-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  ENVIRONMENT: {{ .Values.backend.env.ENVIRONMENT | quote }}
  PORT: {{ .Values.backend.env.PORT | quote }}
  DATABASE_PORT: {{ .Values.backend.env.DATABASE_PORT | quote }}
  DATABASE_NAME: {{ .Values.backend.env.DATABASE_NAME | quote }}
  REDIS_PORT: {{ .Values.backend.env.REDIS_PORT | quote }}
  WORKERS: {{ .Values.backend.env.WORKERS | quote }}
