{{- if .Values.ingress.enabled -}}
{{- $fullName := include "nerolac-portal.fullname" . -}}
{{- $frontendName := include "nerolac-portal.frontend.fullname" . -}}
{{- $backendName := include "nerolac-portal.backend.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "nerolac-portal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ ternary ($.Values.backend.service.name | default $backendName) ($.Values.frontend.service.name | default $frontendName) (eq .service "backend") }}
                port:
                  number: {{ ternary $.Values.backend.service.port $.Values.frontend.service.port (eq .service "backend") }}
          {{- end }}
    {{- end }}
{{- end }}
