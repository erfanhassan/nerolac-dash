apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nerolac-portal.fullname" . }}-backend-secrets
  labels:
    {{- include "nerolac-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  DATABASE_HOST: {{ .Values.backend.env.DATABASE_HOST | default "nerolac-postgres-primary.database.svc.cluster.local" | quote }}
  DATABASE_USER: {{ .Values.backend.env.DATABASE_USER | default "nerolac_app" | quote }}
  DATABASE_PASSWORD: {{ .Values.backend.env.DATABASE_PASSWORD | default "CHANGE_ME_PRODUCTION_SECRET" | quote }}
  REDIS_PRIMARY_HOST: {{ .Values.backend.env.REDIS_PRIMARY_HOST | default "nerolac-redis-master.cache.svc.cluster.local" | quote }}
  REDIS_PASSWORD: {{ .Values.backend.env.REDIS_PASSWORD | default "CHANGE_ME_REDIS_SECRET" | quote }}
  VAULT_TOKEN: {{ .Values.backend.env.VAULT_TOKEN | default "nerolac-vault-token-placeholder" | quote }}
