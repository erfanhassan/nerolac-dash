;; ============================================================================
;; Nerolac Operations Dashboard - PgBouncer Connection Pooler Configuration
;; ============================================================================

[databases]
;; Direct mapping to PostgreSQL 16 Primary write database
nerolac_ops_primary = host=nerolac-postgres port=5432 dbname=nerolac_ops auth_user=nerolac_app
;; Read Replica routing endpoint (routed to replica node or primary read-pool)
nerolac_ops_replica = host=nerolac-postgres port=5432 dbname=nerolac_ops auth_user=nerolac_app
;; Default database fallback
nerolac_ops = host=nerolac-postgres port=5432 dbname=nerolac_ops auth_user=nerolac_app

[pgbouncer]
;; ----------------------------------------------------------------------------
;; Network & Port Configuration
;; ----------------------------------------------------------------------------
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = *
listen_port = 6432
unix_socket_dir = /tmp

;; ----------------------------------------------------------------------------
;; Authentication Configuration
;; ----------------------------------------------------------------------------
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = nerolac_app, postgres
stats_users = nerolac_app, monitoring

;; ----------------------------------------------------------------------------
;; Mandatory Enterprise Pool Sizing & Transaction Mode
;; ----------------------------------------------------------------------------
;; Mode: transaction (Connection released back to pool as soon as transaction completes)
pool_mode = transaction

;; Max client connections allowable across all application threads
max_client_conn = 2000

;; Default server connections maintained per database/user combination
default_pool_size = 50

;; Minimum number of server connections in pool
min_pool_size = 10

;; Extra connections allowed during sudden analytical spikes
reserve_pool_size = 25
reserve_pool_timeout = 5.0

;; Maximum total connections to actual PostgreSQL backend
max_db_connections = 100

;; ----------------------------------------------------------------------------
;; Timeouts & Connection Hygiene
;; ----------------------------------------------------------------------------
server_idle_timeout = 600.0
server_connect_timeout = 15.0
server_login_retry = 5.0
query_timeout = 120.0
query_wait_timeout = 120.0
client_idle_timeout = 0.0
client_login_timeout = 30.0

;; Disable server parameter status caching issues in transaction pooling
server_reset_query = DISCARD ALL
server_check_delay = 30.0
server_check_query = SELECT 1
