[project]
name = "nerolac-dash"
version = "0.1.0"
description = "Nerolac Operations Dashboard with Next.js 15, FastAPI, PostgreSQL 16, and Redis 7"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "alembic>=1.13.1",
    "paramiko>=3.4.0",
    "pandera>=0.20.0",
    "pandas>=2.0.0",
    "eval-type-backport>=0.2.0",
    "lightgbm>=4.0.0",
    "prophet>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "venv",
    "node_modules",
    "__pycache__",
    ".next",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_configs = true
exclude = [
    "\\.venv",
    "node_modules",
    "\\.next",
]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "alembic.*", "hvac.*", "pandera.*", "pandas.*", "fastapi.*", "starlette.*", "redis.*", "lightgbm.*", "prophet.*", "cmdstanpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

